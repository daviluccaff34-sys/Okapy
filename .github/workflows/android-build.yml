name: Android validation

on:
  push:
    paths:
      - "launcher/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "launcher/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  android-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit-test task
        working-directory: launcher/android
        run: gradle testDebugUnitTest
